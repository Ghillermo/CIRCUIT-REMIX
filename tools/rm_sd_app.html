<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Remix SD</title>
<style>
  :root { --bg:#111317; --panel:#1a1d23; --panel2:#14171c; --line:#2b2f38; --ink:#e8e9ec; --dim:#9aa0ab; --ok:#7ee787; --warn:#ffb86b; --bad:#ff7b72; --acc:#79c0ff; --sel:#23405e; --dst:#2f4a2f; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,"Segoe UI",sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px 6px; }
  h1 { font-size:1.1rem; margin:0; white-space:nowrap; }
  header .sub { color:var(--dim); font-size:.85rem; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; background:#2b2f38; color:var(--ink); border:0; border-radius:6px; padding:5px 11px; cursor:pointer; }
  button:hover:not(:disabled) { background:#363b45; }
  button.pri { background:var(--acc); color:#0b0d10; }
  button.pri:hover:not(:disabled) { background:#9ad0ff; }
  button.dng { background:#5a2a28; color:#ffd7d3; }
  button.dng:hover:not(:disabled) { background:#74332f; }
  button:disabled { color:#6b717c; cursor:not-allowed; }
  .lang button.on { background:var(--acc); color:#0b0d10; }
  .lang { display:flex; gap:4px; }
  nav { display:flex; gap:2px; padding:0 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; color:var(--dim); border-radius:6px 6px 0 0; padding:7px 14px; }
  nav button.on { background:var(--panel); color:var(--ink); box-shadow:inset 0 -2px 0 var(--acc); }
  #notice { padding:6px 16px; color:var(--warn); }
  #notice:empty { display:none; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 16px; }
  .pane { min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .phead { padding:8px 10px; display:flex; flex-direction:column; gap:6px; border-bottom:1px solid var(--line); }
  .prow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; min-width:0; }
  .prow .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  select, input[type=text], input[type=number] { font:inherit; color:var(--ink); background:#0f1114; border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  select { max-width:100%; min-width:0; flex:1; }
  input[type=number] { width:68px; }
  input[type=range] { accent-color:var(--acc); width:100%; }
  .dim { color:var(--dim); } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .tool { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .tool .hint { color:var(--dim); font-size:.82rem; margin-left:auto; }
  .gauge { height:6px; background:#0f1114; border-radius:3px; overflow:hidden; }
  .gauge i { display:block; height:100%; background:var(--acc); }
  .gauge.over i { background:var(--bad); }
  .list { flex:1; min-height:0; overflow:auto; font-variant-numeric:tabular-nums; }
  .row { display:grid; grid-template-columns:34px 62px minmax(0,1fr) minmax(0,auto) 30px; gap:8px; align-items:center; padding:2px 10px; min-height:24px; border-bottom:1px solid #20242b; cursor:default; user-select:none; }
  .row .c2 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .c0, .row .c1, .row .c3 { color:var(--dim); font-size:.85rem; white-space:nowrap; }
  .row.empty .c2 { color:#5c626d; }
  .row.badrow .c2 { color:var(--bad); }
  .row:hover { background:#20242c; }
  .row.sel { background:var(--sel); }
  .play { padding:0 6px; font-size:.75rem; line-height:18px; }
  canvas.wave { width:100%; height:44px; display:block; background:#0f1114; border-top:1px solid var(--line); }
  .row canvas.mini { vertical-align:middle; margin-right:8px; }
  .plist .row { grid-template-columns:34px 78px minmax(0,1fr) minmax(0,auto) 30px; }
  .pvw { border-top:1px solid var(--line); }
  .pvw[hidden] { display:none; }
  .pvw .cap { padding:4px 10px; font-size:.82rem; color:var(--dim); }
  .pvw canvas { width:100%; height:150px; display:block; background:#0f1114; }
  .blank { padding:28px 20px; text-align:center; color:var(--dim); }
  .blank button { margin-top:10px; }
  footer { padding:0 16px 10px; }
  #prog { width:100%; height:6px; display:block; margin-bottom:4px; }
  #prog[hidden], #progtxt[hidden] { display:none; }
  #progtxt { font-size:.8rem; color:var(--dim); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #log { height:84px; overflow:auto; background:#0b0d10; border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
  dialog a { color:var(--acc); }
  dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:560px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h3 { margin:0 0 8px; font-size:1rem; }
  dialog .body { max-height:50vh; overflow:auto; }
  dialog .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  dialog ul { margin:6px 0; padding-left:18px; }
  dialog.wide { max-width:min(1180px,96vw); width:96vw; }
  dialog.wide .body { max-height:none; }
  .form { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:10px; max-height:62vh; overflow:auto; padding-right:6px; }
  fieldset { border:1px solid var(--line); border-radius:8px; padding:6px 10px 8px; min-width:0; margin:0; }
  legend { color:var(--dim); font-size:.8rem; padding:0 4px; }
  .fld { display:grid; grid-template-columns:minmax(0,150px) minmax(0,1fr) 62px; gap:8px; align-items:center; min-height:26px; }

  .line2 { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }

  .edgrid { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:12px; }
  .roll { height:44vh; overflow:auto; border:1px solid var(--line); border-radius:6px; background:#0f1114; }
  .roll canvas, .bars canvas { display:block; }
  .bars { margin-top:6px; overflow-x:auto; border:1px solid var(--line); border-radius:6px; background:#0f1114; }
  .insp fieldset { margin-bottom:8px; }
  .insp .fld { grid-template-columns:minmax(0,1fr) 72px; }
  .cct { width:100%; border-collapse:collapse; }
  .cct th { color:var(--dim); font-size:.8rem; font-weight:600; text-align:left; padding:2px 6px; }
  .cct td { padding:2px 6px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; grid-auto-rows:minmax(320px,1fr); overflow:auto; } .edgrid { grid-template-columns:1fr; } }
</style>

<body>
<header>
  <h1>Circuit Remix SD</h1>
  <span class="sub" id="sub"></span>
  <div class="right">
    <button id="bSnap" type="button" hidden></button>
    <button id="bRest" type="button" hidden></button>
    <button id="bDev" type="button" class="dng" hidden></button>

    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">Español</button><button type="button" data-lang="en">English</button></div>
  </div>

<nav id="tabs" role="tablist"></nav>

<dialog id="dlg"></dialog>

<script id="core">
/* The microSD card of a Circuit Rhythm, read and written from the browser (File System Access API).  No DOM here: the interface is the next script,
and it can be run on its own.

The formats:
  * a pack = Rhythm/NN_Name (NN 00..30 = the device's packs 1..31; pack 0 is the internal memory; names cut at 30 characters), with Sessions, PCM, meta
    (and the effects folder, carried by a pack copy as any other folder);
  * the firmware finds a file by its NN_ prefix alone: a stray NN_something in those folders can be taken instead of the real file.  So nothing of ours
    is ever left in a pack: backups go to a folder outside it;
  * PCM/NN_Name.wav = 128 samples: from 100 on, the prefix has three digits;
  * Sessions/NN_Name.ncs = 169 092 B, head RUSE or RDEM; 8 tracks x 8 patterns of 2 600 B from 0x2E4: 32 steps of 8 B, settings at + 0x100, 12 lanes at + 0x128.
The device, connected by USB, is one more folder: Device / DevRoot below speak the stock file protocol behind the same calls as a folder handle. */
const SD = (() => {
"use strict";
const NSAMPLES = 128, NSESS = 64, NPACKS = 31, FOLDER_MAX = 30;
const SESS_SIZE = 0x29484, PAT0 = 0x2E4, PAT = 0xA28, NPATS = 64, NSTEPS = 32, STEP = 8, SETT = 0x100, SETN = 40, LANE0 = 0x128, NLANES = 12, MICRO = 6;
const SAMPLE_MAX = 0x2F0000;                                // the stock's loader reads no more of a sample than this
const STEP_EMPTY = Uint8Array.of(0x48, 6, 0, 0, 7, 0xFF, 0, 0);

const pad2 = n => String(n).padStart(2, "0");
const TRACK_NAME = ["Track 1", "Track 2", "Track 3", "Track 4", "Track 5", "Track 6", "Track 7", "Track 8"];
const isFF = (b, a, n) => { for (let i = a; i < a + n; i++) if (b[i] !== 0xFF) return false; return true; };
function latin(b, a, n) { let s = ""; for (let i = a; i < a + n; i++) s += String.fromCharCode(b[i]); return s.replace(/[\s\0]+$/, ""); }
const same = (a, b) => a === b || (!!a.pack && a.pack === b.pack && a.sess === b.sess);

// ---------------------------------------------------------------- the file system
async function entries(dir) {
  const out = [];
  for await (const [name, h] of dir.entries()) out.push([name, h]);
  return out.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
}
async function subdir(dir, name, create = false) {
  try { return await dir.getDirectoryHandle(name, {create}); }
  catch (e) { if (e.name === "NotFoundError" || e.name === "TypeMismatchError") return null; throw e; }
}
const readHandle = async h => new Uint8Array(await (await h.getFile()).arrayBuffer());
async function writeFile(dir, name, bytes) {
  const w = await (await dir.getFileHandle(name, {create: true})).createWritable();
  try { await w.write(bytes); await w.close(); }
  catch (e) { try { await w.abort(); } catch (_) { /* the write's own error is the one to report */ } throw e; }
}
async function treeInfo(dir) {
  let files = 0, bytes = 0;
  for (const [, h] of await entries(dir)) {
    if (h.kind === "directory") { const t = await treeInfo(h); files += t.files; bytes += t.bytes; }
    else { files++; bytes += (await h.getFile()).size; }
  }
  return {files, bytes};
}
async function copyTree(src, dst, tick) {
  for (const [n, h] of await entries(src)) {
    if (/\.crswap$/i.test(n) || (h.kind === "directory" && dst.accepts && !dst.accepts(n))) continue;     // the browser's temporary file; a folder the device has no type for
    if (h.kind === "directory") await copyTree(h, await dst.getDirectoryHandle(n, {create: true}), tick);
    else { const b = await readHandle(h); await writeFile(dst, n, b); if (tick) tick(n, b.length); }
  }
}
async function sameTree(a, b) {                             // every file of a is in b with its size
  for (const [n, h] of await entries(a)) {
    if (/\.crswap$/i.test(n) || (h.kind === "directory" && b.accepts && !b.accepts(n))) continue;
    if (h.kind === "directory") { const d = await subdir(b, n); if (!d || !await sameTree(h, d)) return false; continue; }
    let f; try { f = await (await b.getFileHandle(n)).getFile(); } catch (_) { return false; }
    if (f.size !== (await h.getFile()).size) return false;
  }
  return true;
}

// ---------------------------------------------------------------- backups: a folder of the user's, outside the packs
class Backup {
  constructor(dir, title) {
    this.dir = dir; this.title = title || dir.name; this.seen = new Set(); this.count = 0;
    const d = new Date(); this.stamp = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
  }
  async folder(parts) { let h = await subdir(this.dir, this.stamp, true); for (const p of parts) h = await subdir(h, p, true); return h; }
  async file(parts, name, bytes) {                          // only the first version of a file in this run: the one that was on the card
    const key = parts.concat(name).join("/");
    if (this.seen.has(key)) return;
    await writeFile(await this.folder(parts), name, bytes); this.seen.add(key); this.count++;
  }
  async tree(src, parts) { await copyTree(src, await this.folder(parts), () => { this.count++; }); }
}

// ---------------------------------------------------------------- the card
class Pack {
  constructor(card, slot, name, folder, dir) { this.card = card; this.slot = slot; this.name = name; this.folder = folder; this.dir = dir; this.drop(); }
  drop() { this._banks = null; this._samples = null; this._sessions = null; this._open = new Map(); this._info = null; }
}
class Card {
  constructor(root, top) { this.root = root; this.top = top; this.packs = []; }
  static async open(root) {
    const t = await subdir(root, "Rhythm"), c = new Card(root, t || root);
    await c.scan();
    if (!c.packs.length && !t) throw new Error("no-packs");
    return c;
  }
  async scan() {
    const keep = new Map(this.packs.map(p => [p.folder, p])), out = [];
    for (const [n, h] of await entries(this.top)) {
      const m = /^(\d\d)_(.*)$/.exec(n);
      if (!m || h.kind !== "directory" || +m[1] >= NPACKS) continue;
      if (!(await subdir(h, "PCM") || await subdir(h, "Sessions"))) continue;
      out.push(keep.get(n) || new Pack(this, +m[1], m[2], n, h));
    }
    this.packs = out;
  }
  async reset() { this.packs = []; await this.scan(); }
  pack(slot) { return this.packs.find(p => p.slot === slot) || null; }
}
function folderName(slot, name) { return (pad2(slot) + "_" + name).slice(0, FOLDER_MAX).replace(/[\s.]+$/, ""); }

async function packInfo(pack) {
  if (pack.dir.device) return null;                         // every pack's folders, one list at a time, is too slow over USB
  if (pack._info) return pack._info;
  const count = async (sub, re) => { const d = await subdir(pack.dir, sub); return d ? (await entries(d)).filter(e => re.test(e[0])).length : 0; };
  return pack._info = {sessions: await count("Sessions", /\.ncs$/i), samples: await count("PCM", /\.wav$/i)};
}
async function copyPack(pack, card, slot, ctx = {}) {
  if (card.packs.some(p => p.slot === slot)) throw new Error("slot-used");
  const folder = folderName(slot, pack.name), dst = await card.top.getDirectoryHandle(folder, {create: true});
  try {
    const all = await treeInfo(pack.dir); let done = 0;
    await copyTree(pack.dir, dst, n => { done++; if (ctx.progress) ctx.progress(n, done, all.files); });
    if (dst.finish) await dst.finish();
    if (!await sameTree(pack.dir, dst)) throw new Error("verify");
  } catch (e) { await card.top.removeEntry(folder, {recursive: true}); throw e; }
  await card.scan();
  return card.pack(slot);
}
async function deletePack(pack, ctx = {}) {
  if (ctx.backup) await ctx.backup.tree(pack.dir, [pack.folder]);
  const card = pack.card;
  await card.top.removeEntry(pack.folder, {recursive: true});
  await card.scan();
}
async function movePack(pack, card, slot, ctx = {}) {       // the API has no folder rename: a verified copy, then the source goes (no backup needed: the copy is it)
  if (pack.card === card && pack.slot === slot) return pack;
  if (pack.card === card && card.top.renameEntry) {      // the device can
    if (card.packs.some(p => p.slot === slot)) throw new Error("slot-used");
    await card.top.renameEntry(pack.folder, folderName(slot, pack.name));
    await card.reset();
    return card.pack(slot);
  }
  const out = await copyPack(pack, card, slot, ctx);
  await deletePack(pack, {});
  return out;
}

// the firmware's lookup by prefix: what can shadow a real file of the pack
async function audit(pack) {
  const out = [], kinds = [["Sessions", /^\d\d_.+\.ncs$/i], ["PCM", /^\d{2,3}_.+\.wav$/i], ["meta", /^\d\d_.+\.ncm$/i]];
  for (const [sub, re] of kinds) {
    const d = await subdir(pack.dir, sub);
    if (!d) continue;
    const seen = new Map();
    for (const [n] of await entries(d)) {
      const m = /^(\d{2,3})_/.exec(n);
      if (!m) continue;
      if (!re.test(n)) { out.push({file: sub + "/" + n, why: "stray"}); continue; }
      if (seen.has(m[1])) out.push({file: sub + "/" + n, why: "twin", with: sub + "/" + seen.get(m[1])});
      else seen.set(m[1], n);
    }
  }
  return out;
}

// ---------------------------------------------------------------- samples: PCM/NN_Name.wav
function wavInfo(b) {
  if (b.length < 12 || latin(b, 0, 4) !== "RIFF" || latin(b, 8, 4) !== "WAVE") return null;
  const v = new DataView(b.buffer, b.byteOffset, b.byteLength), out = {};
  for (let o = 12; o + 8 <= b.length;) {
    const id = latin(b, o, 4), n = v.getUint32(o + 4, true);    // latin() trims: "fmt " reads "fmt"
    if (id === "fmt") { out.format = v.getUint16(o + 8, true); out.channels = v.getUint16(o + 10, true); out.rate = v.getUint32(o + 12, true); out.bits = v.getUint16(o + 22, true); }
    else if (id === "data") { out.at = o + 8; out.data = Math.min(n, b.length - o - 8); break; }
    o += 8 + n + (n & 1);
  }
  return out;
}
async function samplesOf(pack) {
  if (pack._samples) return pack._samples;
  const m = new Map(), d = await subdir(pack.dir, "PCM");
  if (d) for (const [n, h] of await entries(d)) {
    const r = /^(\d{2,3})_(.*)\.wav$/i.exec(n);
    if (!r || h.kind !== "file" || +r[1] >= NSAMPLES || m.has(+r[1])) continue;
    m.set(+r[1], {slot: +r[1], name: r[2], file: n, handle: h, size: (await h.getFile()).size});
  }
  return pack._samples = m;
}
const Samples = {
  size: NSAMPLES,
  async list(pl) {
    const m = await samplesOf(pl.pack), out = [];
    for (let n = 0; n < NSAMPLES; n++) { const e = m.get(n); out.push(e ? {slot: n, empty: false, name: e.name, size: e.size} : {slot: n, empty: true, name: "", size: 0}); }
    return out;
  },
  async bytes(pl) { let b = 0; for (const e of (await samplesOf(pl.pack)).values()) b += Math.min(SAMPLE_MAX, Math.max(0, e.size - 44)); return b; },
  async get(pl, n) { const e = (await samplesOf(pl.pack)).get(n); return e ? {name: e.name, bytes: await readHandle(e.handle)} : null; },
  async put(pl, n, item, ctx = {}) {
    if (!item) return Samples.clear(pl, n, ctx);
    const pack = pl.pack, d = await subdir(pack.dir, "PCM", true), old = (await samplesOf(pack)).get(n), file = (pad2(n) + "_" + item.name).slice(0, 26) + ".wav";
    if (old && ctx.backup) await ctx.backup.file([pack.folder, "PCM"], old.file, await readHandle(old.handle));
    await writeFile(d, file, item.bytes);
    if (old && old.file !== file) await d.removeEntry(old.file);   // after the write: an old file gone before the new one lands would lose the slot
    pack._samples = null; pack._info = null;
  },
  async rename(pl, n, m) {
    const pack = pl.pack, old = (await samplesOf(pack)).get(n);
    await (await subdir(pack.dir, "PCM")).renameEntry(old.file, pad2(m) + old.file.slice(old.file.indexOf("_")));
    pack._samples = null;
  },
  async clear(pl, n, ctx = {}) {
    const pack = pl.pack, old = (await samplesOf(pack)).get(n);
    if (!old) return;
    if (ctx.backup) await ctx.backup.file([pack.folder, "PCM"], old.file, await readHandle(old.handle));
    await (await subdir(pack.dir, "PCM")).removeEntry(old.file);
    pack._samples = null; pack._info = null;
  },
};

// ---------------------------------------------------------------- renaming: only the name after NN_ changes, the slot stays
// What would break the data: a name FAT stores differently from how it was asked (trailing spaces or dots dropped, characters it refuses), a name the
// device's protocol refuses (printable ASCII, 31 B with the number), longer than the app's own limits (a pack folder of 30, a sample of 26 before .wav),
// or the same file as another one of the folder (FAT does not tell case apart).  The NN_ prefix, by which the firmware finds the file, never changes.
const RENAME_TMP = "~rename";                               // no NN_ prefix: neither the firmware nor Card.scan takes it
function nameMax(kind, slot) { return kind === "pack" ? FOLDER_MAX - 3 : 26 - (slot >= 100 ? 4 : 3); }
function nameProblem(kind, slot, name, others) {            // -> null, or the reason (rename-*)
  if (!name) return "rename-empty";
  if (name !== name.trim() || name.endsWith(".")) return "rename-edge";
  if (!/^[ -~]+$/.test(name)) return "rename-ascii";
  if (/[\\/:*?"<>|]/.test(name)) return "rename-char";
  if (name.length > nameMax(kind, slot)) return "rename-long";
  const full = (pad2(slot) + "_" + name + (kind === "pack" ? "" : ".wav")).toLowerCase();
  if (others.some(o => o.toLowerCase() === full)) return "rename-taken";
  return null;
}
async function moveHandle(h, to) {                          // a PC file or folder renamed in place; false when this browser cannot (the caller copies)
  if (typeof h.move !== "function") return false;
  try { await h.move(to); return true; }

async function transferAct(p, move) {
  const q = p.other, tab = state.tab;
  if (tab === "packs") return packTransfer(p, move);
  const src = p.place(), dst = q.place();
  if (!src || !dst) return say(T("Falta el destino", "No target"), T("Abre una carpeta y elige un pack en cada lado.", "Open a folder and choose a pack on each side."));
  const from = selected(p);
  if (!from.length) return say(T("Nada elegido", "Nothing chosen"), T("Elige una o varias filas con contenido.", "Choose one or more rows with content."));
  const to = targets(q, from.length);
  if (!to) return say(T("No cabe", "It does not fit"), T("No hay huecos suficientes: elige el destino en el otro lado.", "Not enough slots: choose the target on the other side."));
  const place = SD.same(src, dst);
  if (place && to.every((n, i) => n === from[i])) return;
  const hit = to.filter(n => !q.items[n].empty && !(place && move && from.includes(n)));
  const overlap = place && to.some(n => from.includes(n));
  let swap = false;
  if (hit.length) {
    const btn = [[T("Sobrescribir", "Overwrite"), "over", "dng"]];
    if (move && !overlap) btn.push([T("Intercambiar", "Swap"), "swap", "pri"]);
    btn.push([T("Cancelar", "Cancel"), null]);
    const c = await ask(T("Huecos ocupados", "Slots in use"), T("Ya hay algo en:", "These are in use:") + nameList(hit.map(n => itemName(tab, q.items[n]))), btn);
    if (!c) return;
    swap = c === "swap";
  }
  if (dst.pack && !await ready(dst.pack.card, move ? src.pack.card : null)) return;
  if (!await loadedOK(dst.pack) || (move && !await loadedOK(src.pack))) return;
  q.sel.clear(); p.sel.clear();
  await run(`${swap ? T("Intercambiar", "Swap") : move ? T("Mover", "Move") : T("Copiar", "Copy")} ${from.length}`, ctx => SD.transfer(KIND[tab], src, from, dst, to, {move, swap}, ctx));
}
async function packTransfer(p, move) {

  const to = targets(q, from.length);
  if (!to) return say(T("No cabe", "It does not fit"), T("No hay huecos de pack suficientes a partir del destino.", "Not enough pack slots from the target on."));
  if (to.some(n => !q.items[n].empty)) return say(T("Huecos ocupados", "Slots in use"), T("El destino de un pack tiene que estar libre: elimina antes el que hay o elige otro hueco.", "A pack's target must be free: delete what is there first or choose another slot."));

    (move ? T("<p>El navegador no puede renombrar carpetas: cada pack se copia entero, se comprueba y después se borra el original.</p>", "<p>The browser cannot rename folders: each pack is copied whole, checked, and then the original is deleted.</p>") : ""), [[T("Seguir", "Go on"), true, "pri"], [T("Cancelar", "Cancel"), false]]);

    for (let i = 0; i < packs.length; i++) { log(packs[i].folder); await (move ? SD.movePack : SD.copyPack)(packs[i], q.card, to[i], ctx); }

async function openMidi() {

  input.onmidimessage = e => { if (e.data[0] === 0xF0 && tx.onmessage) tx.onmessage(e.data); };

}

  inp.oninput = check; check();
  const name = await new Promise(res => {
    d.onclick = e => { const r = e.target.dataset ? e.target.dataset.r : null; if (!r || (r === "ok" && ok.disabled)) return; d.close(); res(r === "ok" ? inp.value : null); };
    inp.onkeydown = e => { if (e.key === "Enter" && !ok.disabled) { d.close(); res(inp.value); } };
    d.oncancel = () => res(null);
    d.showModal(); inp.focus(); inp.select();
  });
  if (name === null || !await ready(p.card)) return;
  if (kind === "sample" && !await loadedOK(pack)) return;
  if (kind === "pack" && p.card.device && p.card.device.loaded === n + 1) return say(T("Es el pack cargado", "It is the loaded pack"), T("No renombres por USB el pack que el aparato tiene cargado: carga otro antes.", "Do not rename over USB the pack the device has loaded: load another one first."));
  p.sel.clear();
  await run(`${T("Renombrar", "Rename")} ${pre}${cur} → ${pre}${name}`, ctx => kind === "pack" ? SD.renamePack(pack, name, ctx) : SD.renameSample(p.place(), n, name, ctx));
}
async function editAct(p) {
  const n = p.sel.size ? Math.min(...p.sel) : null;
  if (n === null) return say(T("Nada elegido", "Nothing chosen"), T("Elige una fila.", "Choose a row."));
  if (state.tab === "patterns") return editPattern(p, n);
}

// ---- Arrhythmia's modules: a proof of concept.  The module files (.mod) are Arrhythmia's (llcoolkm, MIT; github.com/llcoolkm/arrhythmia): Circuit
// Remix 0.11 (RH67) and later run them with our host of its interface (ABI 3, tools/modhost.py), over the SysEx of its module host: 04 write, 7D read
// back, 05 start (status 7F), 00 stop, 0A the controls.  Its own connection: the file session above stops the transport and locks the panel.
const ARR = "https://github.com/llcoolkm/arrhythmia", MPRE = [0xF0, 0x00, 0x20, 0x29, 0x00, 0x60];
const g7 = (b, a, n) => { let v = 0; for (let i = a; i < a + n; i++) v = v * 128 + b[i]; return v; };
const p7 = (v, n) => Array.from({length: n}, (_, i) => Math.floor(v / 128 ** (n - 1 - i)) & 0x7F);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function modCheck(b) {                                      // the unit's checks before a start: magic, size, CRC-32
  const magic = String.fromCharCode(...b.subarray(0, 4)), hdr = {CRM1: 24, CRM2: 28}[magic];
  if (!hdr) return T("no es un módulo (cabecera ", "not a module (header ") + esc(magic) + ")";
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength), size = dv.getUint32(4, true), crc = dv.getUint32(8, true);
  if (size !== b.length || size < hdr + 2 || size > 0x3C00) return T("tamaño ", "size ") + size;
  const z = b.slice(); z.fill(0, 8, 12);
  return SD.crc32(z) === crc ? null : T("CRC-32 erróneo", "bad CRC-32");
}
class ModHost {
  constructor(tx) { this.tx = tx; this.q = []; this.wake = null; tx.onmessage = m => { this.q.push(m); if (this.wake) { const w = this.wake; this.wake = null; w(); } }; }
  send(cmd, args = []) { this.tx.send(Uint8Array.from([...MPRE, cmd, ...args, 0xF7])); }
  async reply(cmd, ms) {
    const end = Date.now() + ms;
    for (;;) {
      while (this.q.length) { const m = this.q.shift(); if (MPRE.every((x, i) => m[i] === x) && m[6] === cmd) return m; }
      const left = end - Date.now();
      if (left <= 0) throw new Error("mod-timeout");
      await new Promise(res => { const t = setTimeout(() => { this.wake = null; res(); }, left); this.wake = () => { clearTimeout(t); res(); }; });
    }
  }
  async ask(cmd, args = [], rcmd = cmd, ms = 2000) { this.q.length = 0; this.send(cmd, args); return this.reply(rcmd, ms); }
  st(r) { if (r.length !== 20) throw new Error("mod-reply"); return {mode: r[7], owned: !!(r[8] & 2), frames: g7(r, 14, 4), module: r[18]}; }
  async status() { return this.st(await this.ask(0x7F)); }
  async upload(b, tick) {
    for (let o = 0; o < b.length; o += 32) {                 // 50 ms apart: 5 ms (as Arrhythmia's module.py) loses messages on the unit
      this.send(0x04, [...p7(o, 3), ...[...b.subarray(o, o + 32)].flatMap(x => [x >> 4, x & 15])]);
      tick(o, b.length); await sleep(50);
    }
    for (let a = 0x400; a < 0x400 + b.length; a += 32) {
      const r = await this.ask(0x7D, p7(a, 5));
      if (r.length !== 77 || g7(r, 7, 5) !== a) throw new Error("mod-readback");
      for (let k = 0; k < 32 && a - 0x400 + k < b.length; k++) if ((r[12 + 2 * k] << 4 | r[13 + 2 * k]) !== b[a - 0x400 + k]) throw new Error("mod-readback");
    }
    return this.st(await this.ask(0x05, [], 0x7F));
  }
}
const MODULE = s => [T("ninguno", "none"), T("válido", "valid"), T("erróneo", "bad"), T("ITCM no disponible", "ITCM unavailable")][s.module] || s.module;
async function modsAct() {
  if (state.busy) return;
  if (state.dev) return say(T("Módulos", "Modules"), T("Desconecta antes el aparato: la sesión de ficheros para el transporte y bloquea el panel.", "Disconnect the device first: the file session stops the transport and locks the panel."));
  const d = $("mods"), a = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
  d.innerHTML = `<h3>${T("Módulos de Arrhythmia · prueba de concepto", "Arrhythmia modules · proof of concept")}</h3><div class="body">
    <p>${T(`Los módulos son de ${a(ARR, "Arrhythmia")} (llcoolkm, licencia MIT): su interfaz, sus ficheros y su documentación. Circuit Remix 0.11 o posterior los acepta por USB con la misma interfaz, así que un mismo <code>.mod</code> corre en las dos firmwares.`,
      `The modules are ${a(ARR, "Arrhythmia")}'s (llcoolkm, MIT licence): its interface, its files and its documentation. Circuit Remix 0.11 or later takes them over USB through the same interface, so one <code>.mod</code> runs on both firmwares.`)}</p>
    <p>${T(`Descarga los <code>.mod</code> de las ${a(ARR + "/releases", "releases de Arrhythmia")}; qué hace cada uno: ${a(ARR + "/blob/main/docs/user/modules.md", "su guía de módulos")}.`,
      `Download the <code>.mod</code> files from ${a(ARR + "/releases", "Arrhythmia's releases")}; what each one does: ${a(ARR + "/blob/main/docs/user/modules.md", "its modules guide")}.`)}</p>
    <p class="warn">${T("Prueba de concepto: sin el selector de la tarjeta de Arrhythmia; el módulo se pierde al apagar. Un módulo corre como código nativo en el aparato: usa solo módulos de confianza. Para salir: Parar, o Shift + Sample Rec en el aparato.",
      "Proof of concept: without Arrhythmia's card picker; the module is gone at power-off. A module runs as native code on the unit: use only modules you trust. To leave it: Stop, or Shift + Sample Rec on the unit.")}</p>
    <div class="prow"><input type="file" id="modFile" accept=".mod"></div>
    <div class="prow" style="margin-top:8px"><button type="button" class="pri" data-m="up">${T("Subir y arrancar", "Upload and start")}</button><button type="button" data-m="stop">${T("Parar", "Stop")}</button><button type="button" data-m="own">${T("Controles: módulo / aparato", "Controls: module / unit")}</button><button type="button" data-m="st">${T("Estado", "Status")}</button></div>
    <p id="modSt" class="dim"></p></div><div class="btns"><button type="button" data-m="close">${T("Cerrar", "Close")}</button></div>`;
  let host = null, busy = false;
  const show = (t, cls = "dim") => { const e = $("modSt"); e.className = cls; e.textContent = t; };
  const desc = s => `${s.mode === 3 ? T("módulo en marcha", "module running") : T("normal", "normal")} · ${T("controles", "controls")}: ${s.owned ? T("el módulo", "the module") : T("el aparato", "the unit")} · ${T("fotogramas", "frames")} ${s.frames} · ${T("módulo en ITCM", "module in ITCM")}: ${MODULE(s)}`;
  const fail = e => show(e.message === "mod-timeout" ? T("Sin respuesta: hace falta Circuit Remix 0.11 o posterior conectado por USB (y cerrar Components).", "No reply: Circuit Remix 0.11 or later must be connected by USB (and Components closed).")
    : e.message === "mod-readback" ? T("La lectura de vuelta no coincide: vuelve a subirlo.", "The read-back does not match: upload it again.") : errText(e), "bad");
  d.onclick = async e => {
    const m = e.target.dataset ? e.target.dataset.m : null;
    if (!m) return;
    if (m === "close") { d.close(); return; }
    if (busy) return;
    busy = true;
    try {
      if (!host) host = new ModHost(await openMidi());
      const h = host;
      if (m === "st") show(desc(await h.status()));
      else if (m === "stop") { h.send(0x00); await sleep(100); show(desc(await h.status())); }
      else if (m === "own") { const s = await h.status(); show(desc(h.st(await h.ask(0x0A, [s.owned ? 0 : 1], 0x7F)))); }
      else if (m === "up") {
        const f = $("modFile").files[0];
        if (!f) { show(T("Elige un fichero .mod.", "Choose a .mod file."), "warn"); return; }
        const b = new Uint8Array(await f.arrayBuffer()), bad = modCheck(b);
        if (bad) { show(`${f.name}: ${bad}`, "bad"); return; }
        const s = await h.upload(b, (o, n) => show(`${T("Subiendo", "Uploading")} ${f.name}: ${o} / ${n} B`));
        show(`${f.name}: ${T("subido y comprobado", "uploaded and verified")} (${b.length} B) · ${desc(s)}`, s.mode === 3 ? "ok" : "bad");
      }
    } catch (err) { fail(err); }
    finally { busy = false; }
  };
  d.onclose = () => { if (host) host.tx.close(); host = null; d.innerHTML = ""; };
  d.showModal();
}

// ---- events
for (const p of panes) {
  p.el.addEventListener("click", async e => {
    if (state.busy) return;
    const t = e.target, act = t.dataset ? t.dataset.act : null;
    if (t.dataset && t.dataset.play !== undefined) { play(p, +t.dataset.play, t); return; }
    if (act === "open") return openFolder(p);
    if (act === "device") return connectDevice(p);
    if (act === "reload") { if (p.card) { await p.card.reset(); for (const q of panes) if (q.card === p.card) q.sel.clear(); await renderAll(); } return; }
    if (act === "copy") return transferAct(p, false);
    if (act === "move") return transferAct(p, true);
    if (act === "del") return deleteAct(p);
    if (act === "rename") return renameAct(p);
    if (act === "export") return exportAct(p);
    if (act === "edit") return editAct(p);
    if (act === "issues") {
      const why = i => i.why === "stray" ? T("no es un fichero del pack", "not a file of the pack") : T("mismo número que ", "same number as ") + i.with;
      return say(T("Ficheros que pueden tapar a los del pack", "Files that can hide the pack's own"), T("<p>El aparato busca por el prefijo NN_: estos ficheros pueden ocupar el lugar del fichero real. Quítalos desde el PC.</p>", "<p>The device looks files up by their NN_ prefix: these can take the real file's place. Remove them from the PC.</p>") + nameList(p.issues.map(i => `${i.file} (${why(i)})`), 30));
    }
    const row = t.closest(".row");
    if (row) clickRow(p, +row.dataset.n, e);
  });
  p.el.addEventListener("dblclick", e => {
    if (state.busy) return;
    const row = e.target.closest(".row"); if (!row) return;
    const n = +row.dataset.n; p.sel = new Set([n]); paint(p);
    if (state.tab === "samples") { if (!p.items[n].empty) play(p, n, row.querySelector(".play")); }
    else if (state.tab === "patterns") editAct(p);
  });
  p.el.addEventListener("change", async e => {
    const t = e.target, w = t.dataset ? t.dataset.sel : null;
    if (w === "pack") { p.packSlot = +t.value; p.sess = null; p.sel.clear(); stopAudio(); await render(p); }
    else if (w === "sess") { p.sess = +t.value; p.sel.clear(); await render(p); }
    else if (w === "track") { p.track = +t.value; p.sel.clear(); await render(p); }
    else return;
    paint(p.other);
  });
}
function drawChrome() {
  document.documentElement.lang = LANG;
  $("sub").textContent = T("Packs, samples y patrones de la tarjeta microSD o del aparato", "Packs, samples and patterns of the microSD card or the device");
  $("tabs").innerHTML = TABS.map(t => `<button type="button" role="tab" data-tab="${t[0]}">${esc(T(t[1], t[2]))}</button>`).join("");
  for (const b of document.querySelectorAll(".lang button")) b.classList.toggle("on", b.dataset.lang === LANG);
  $("notice").textContent = state.dev ? T("Aparato conectado: transporte parado y panel bloqueado hasta Desconectar.", "Device connected: transport stopped and panel locked until Disconnect.")
    : window.showDirectoryPicker ? "" : T("Este navegador no puede abrir carpetas: usa Chrome o Edge en un ordenador.", "This browser cannot open folders: use Chrome or Edge on a computer.");
  $("bMods").textContent = T("Módulos (prueba de concepto)…", "Modules (proof of concept)…");
  $("bDev").hidden = !state.dev; $("bDev").textContent = T("Desconectar aparato", "Disconnect device");
  $("bSnap").hidden = $("bRest").hidden = !state.dev; $("bSnap").textContent = T("Snapshot…", "Snapshot…"); $("bRest").textContent = T("Restaurar…", "Restore…");
  paintBackup();
}
$("tabs").addEventListener("click", async e => {
  const t = e.target.dataset ? e.target.dataset.tab : null;
  if (!t || state.busy || t === state.tab) return;
  stopAudio(); state.tab = t; for (const p of panes) p.sel.clear();
  await renderAll();
});
document.querySelector(".lang").addEventListener("click", async e => {
  const l = e.target.dataset ? e.target.dataset.lang : null;
  if (!l || l === LANG) return;
  LANG = l; try { localStorage.setItem("rmsdapp.lang", l); } catch (_) { /* no storage: this page only */ }
  drawChrome(); await renderAll();
});
$("bBackup").addEventListener("click", pickBackup);
$("bMods").addEventListener("click", modsAct);
$("bDev").addEventListener("click", disconnect);
$("bSnap").addEventListener("click", snapAct);
$("bRest").addEventListener("click", restAct);
window.addEventListener("pagehide", () => { if (state.dev) state.dev.dev.closeNow(); });   // an abandoned session keeps the panel locked
drawChrome();
renderAll();
window.SDAPP = {state, panes, openRoot, renderAll, attach, disconnect, snapTo, restoreFrom, setBackup: dir => { state.backup = dir ? new SD.Backup(dir) : null; state.noBackup = !dir; paintBackup(); }};
})();
</script>
</body>
